<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwrite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">Handwrite</div>
  <div class="segmented" id="view-switch">
    <button data-view="preview" class="on">预览</button>
    <button data-view="text">文字</button>
  </div>
  <div class="bar-right">
    <button class="pill update hidden" id="btn-update" title="打开下载页">新版本</button>
    <button class="pill ghost" id="btn-open">打开文件</button>
    <button class="pill primary" id="btn-export" disabled>导出 PDF</button>
  </div>
</header>

<main class="stage">
  <section class="canvas" id="canvas">
    <div class="empty" id="empty">
      <div class="empty-icon">✎</div>
      <h1>把作业拖到这里</h1>
      <p>支持 Word (.docx)、PDF 和 .txt<br>一切都在你的电脑上完成，不会上传</p>
      <button class="pill primary" id="btn-open-2">选择文件</button>
    </div>

    <div class="viewer hidden" id="viewer">
      <div class="page-wrap">
        <img id="page" alt="预览">
        <div class="spinner hidden" id="spinner"><div class="ring"></div><span id="spinner-text">正在书写…</span></div>
      </div>
      <div class="pager">
        <button class="round" id="prev">‹</button>
        <span id="page-label">1 / 1</span>
        <button class="round" id="next">›</button>
      </div>
    </div>

    <div class="editor hidden" id="editor">
      <textarea id="text" spellcheck="false" placeholder="在这里粘贴或修改要写的内容。
# 开头是标题；空行空一行；行首空格缩进；x^2 上标；H_{2}O 下标；\frac{1}{n} 分数。"></textarea>
      <div class="editor-hint">改完切回「预览」就会重新书写</div>
    </div>
  </section>

  <aside class="panel">
    <div class="group">
      <div class="group-title">纸张</div>
      <div class="stepper" data-key="paper"></div>
      <div class="stepper" data-key="texture"></div>
    </div>
    <div class="group">
      <div class="group-title">笔</div>
      <div class="stepper" data-key="font"></div>
      <div class="stepper" data-key="zh_font"></div>
      <div class="stepper" data-key="ink"></div>
      <div class="stepper" data-key="pressure"></div>
    </div>
    <div class="group">
      <div class="group-title">写法</div>
      <div class="stepper" data-key="level"></div>
      <div class="stepper" data-key="size"></div>
      <div class="stepper" data-key="slant"></div>
      <div class="stepper" data-key="letter_gap"></div>
      <div class="stepper" data-key="word_gap"></div>
      <div class="stepper" data-key="slips"></div>
    </div>
    <div class="group">
      <div class="group-title">成品</div>
      <div class="stepper" data-key="scan"></div>
    </div>
    <div class="group identity">
      <div class="group-title">笔迹</div>
      <div class="code-row">
        <input class="code" id="code" value="····-··" maxlength="16" spellcheck="false" autocomplete="off" title="可以直接输入自己的笔迹 ID">
        <button class="pill small" id="btn-code">换一种笔迹</button>
      </div>
      <button class="pill small ghost wide" id="btn-shuffle">重新排一版</button>
      <div class="hint">笔迹 ID 决定每个字（字母和汉字）的固定习惯，会一直记住。想和上次一样，就填回原来的 ID。</div>
    </div>
    <div class="group about">
      <div class="group-title">版本</div>
      <div class="about-row">
        <span id="version">Handwrite</span>
        <button class="pill small" id="btn-check">检查更新</button>
      </div>
      <label class="switch-row"><input type="checkbox" id="auto-update" checked> 打开时自动检查</label>
      <div class="hint" id="update-status">只向 GitHub 问一下最新版本号，不会上传任何内容。</div>
    </div>
  </aside>
</main>

<div class="drop-overlay hidden" id="drop-overlay"><div>松开，开始书写</div></div>
<div class="toast hidden" id="toast"></div>
<input type="file" id="file-input" accept=".docx,.pdf,.txt,.md" hidden>
<script src="app.js"></script>
</body>
</html>
