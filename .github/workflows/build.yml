name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (M1 and later)
            artifact: Handwrite-macOS-AppleSilicon
          - os: macos-15-intel     # Intel Macs
            artifact: Handwrite-macOS-Intel
          - os: windows-latest
            artifact: Handwrite-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Handwrite.app ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Handwrite.exe
            dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Handwrite.exe
            dist/*.zip
